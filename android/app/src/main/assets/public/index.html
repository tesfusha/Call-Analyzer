    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('callanalyzer.theme.v3') || 'null');
          var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          var systemDark = Boolean(mql && mql.matches);
          var hasManualOverride = pref === 'light' || pref === 'dark' || pref === 'dark-gray';
          var isDark = hasManualOverride ? (pref === 'dark' || pref === 'dark-gray') : systemDark;
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('dark-gray', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (hasManualOverride) {
            var activeColor = isDark ? '#111214' : '#FFFFFF';
            for (var i = 0; i < metas.length; i++) {
              metas[i].setAttribute('content', activeColor);
            }
          }
          var fontScale = JSON.parse(localStorage.getItem('callanalyzer.fontSize.v1') || '"default"');
          if (fontScale === 'large') {
            root.dataset.fontScale = 'large';
            root.style.fontSize = '17.5px';
          } else if (fontScale === 'xlarge') {
            root.dataset.fontScale = 'xlarge';
            root.style.fontSize = '19px';
          } else {
            root.dataset.fontScale = 'default';
            root.style.fontSize = '16px';
          }
        } catch (e) {}
      })();
    </script>
