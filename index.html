<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Call Analyzer - ETH</title>
    <meta name="description" content="Minimalist call-log companion with call history, analytics, dual-SIM usage breakdown, quiet-contact reminders, and CSV/JSON import/export." />
    <meta property="og:title" content="Call Analyzer - ETH" />
    <meta property="og:description" content="Minimalist call-log companion with call history, analytics, dual-SIM usage breakdown, quiet-contact reminders, and CSV/JSON import/export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://youthful-limiter-kjk7s.firebaseapp.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('callanalyzer.theme.v3') || 'null');
          var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          var systemDark = Boolean(mql && mql.matches);
          var hasManualOverride = pref === 'light' || pref === 'dark' || pref === 'dark-gray';
          var isDark = hasManualOverride ? (pref === 'dark' || pref === 'dark-gray') : systemDark;
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('dark-gray', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (hasManualOverride) {
            var activeColor = isDark ? '#111214' : '#FFFFFF';
            for (var i = 0; i < metas.length; i++) {
              metas[i].setAttribute('content', activeColor);
            }
          }
          var fontScale = JSON.parse(localStorage.getItem('callanalyzer.fontSize.v1') || '"default"');
          if (fontScale === 'large') {
            root.dataset.fontScale = 'large';
            root.style.fontSize = '17.5px';
          } else if (fontScale === 'xlarge') {
            root.dataset.fontScale = 'xlarge';
            root.style.fontSize = '19px';
          } else {
            root.dataset.fontScale = 'default';
            root.style.fontSize = '16px';
          }
        } catch (e) {}
      })();
      (function () {
        var bootErrors = [];
        var mounted = false;
        var watchdogTimer = null;
        function renderBootFailure(reason) {
          if (mounted) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) {
            mounted = true;
            return;
          }
          var msg = reason || bootErrors[0] || 'App bundle failed to start in WebView.';
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#111214;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="width:100%;max-width:420px;background:#1B1C20;border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:20px;box-sizing:border-box;">' +
            '<div style="font-size:16px;font-weight:700;color:#FF6A00;margin-bottom:8px;">Startup Error</div>' +
            '<div style="font-size:13px;line-height:1.5;color:#E5E7EB;word-break:break-word;margin-bottom:14px;">' +
            String(msg).replace(/[<>&]/g, function (c) { return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; }) +
            '</div>' +
            '<button type="button" onclick="window.location.reload()" style="min-height:42px;padding:10px 18px;border-radius:10px;border:none;background:#FF6A00;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Reload App</button>' +
            '</div></div>';
        }
        window.__markAppMounted = function () {
          mounted = true;
          if (watchdogTimer) clearTimeout(watchdogTimer);
        };
        window.__reportBootError = function (err) {
          var text = err && err.message ? err.message : String(err || 'Unknown startup error');
          bootErrors.push(text);
          renderBootFailure(text);
        };
        window.addEventListener('error', function (ev) {
          if (mounted) return;
          var detail = '';
          if (ev && ev.target && (ev.target.src || ev.target.href)) {
            detail = 'Failed to load asset: ' + (ev.target.src || ev.target.href);
          } else if (ev && ev.message) {
            detail = ev.message + (ev.filename ? ' (' + ev.filename + ':' + ev.lineno + ')' : '');
          }
          if (detail) {
            bootErrors.push(detail);
            setTimeout(function () {
              var root = document.getElementById('root');
              if (!mounted && root && root.childElementCount === 0) {
                renderBootFailure(detail);
              }
            }, 400);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          if (mounted) return;
          var r = ev && ev.reason;
          var detail = r && r.message ? r.message : String(r || 'Unhandled startup rejection');
          bootErrors.push(detail);
        });
        watchdogTimer = setTimeout(function () {
          var root = document.getElementById('root');
          if (!mounted && root && root.childElementCount === 0) {
            renderBootFailure(bootErrors.join(' | ') || 'Timed out waiting for app bundle to mount.');
          }
        }, 7000);
      })();
    </script>
  </head>
  <body class="bg-[#F5F7FA] dark:bg-[var(--dark-canvas)] text-[#08246B] dark:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
